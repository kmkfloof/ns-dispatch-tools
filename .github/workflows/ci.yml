name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install runtime dependencies, and Nx
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Get SHA of base and head branch
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v5

      - name: Check formatting
        run: pnpm nx record -- nx format:check

      - name: Build, lint, type-check, run all tests on affected projects
        if: github.event_name == 'pull_request'
        run: pnpm nx affected -t build lint typecheck test

      - name: Build, lint, type-check, run all tests on all projects
        if: github.event_name == 'push'
        run: pnpm nx run-many -t build lint typecheck test
